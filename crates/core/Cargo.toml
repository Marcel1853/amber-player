[package]
name = "amber-core"
version.workspace = true
edition.workspace = true

[dependencies]
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "net", "macros", "fs", "io-util"] }
tokio-util = { version = "0.7", features = ["io"] }
# Nur für HTTP-API und MCP-Server (Feature „server“, am Handy aus)
axum = { version = "0.7", optional = true }
log.workspace = true
rodio = { version = "0.20", default-features = false, features = ["symphonia-all"] }
symphonia = { version = "0.5", features = ["all"] }
minimp3_fixed = "0.5"
regex = "1"
ureq = { version = "2", features = ["json"] }
lofty = "0.22"
rusqlite = { version = "0.32", features = ["bundled"] }
walkdir = "2"
rand = "0.8"
dirs = "5"

[features]
default = ["server"]
# HTTP-API (Stream Deck, TouchDeck, Handy-Streams) und MCP-Server – nur am PC
server = ["dep:axum"]

[dev-dependencies]
tempfile = "3"
