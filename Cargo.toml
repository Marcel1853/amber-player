[workspace]
resolver = "2"
members = ["crates/core", "crates/app", "crates/mobile-plugin"]

[workspace.package]
version = "0.6.5"
edition = "2021"

[workspace.dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["sync"] }
log = "0.4"

[profile.release]
lto = "thin"
codegen-units = 4
strip = true
